<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direktori Link & Shortener - SMK RPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <div class="max-w-xl w-full mx-auto p-6 my-10">
        
        <div class="text-center mb-8">
            <span class="bg-indigo-600 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full text-indigo-100">Pusat Tautan RPL</span>
            <h1 class="text-3xl font-bold mt-3 mb-2">Direktori & Short Link</h1>
            <p class="text-slate-400 text-sm">Cari link materi, tugas, atau akses langsung menggunakan kode parameter.</p>
        </div>

        <div id="status-pesan" class="hidden"></div>

        <div class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-300 mb-2">Pencarian Kata Kunci:</label>
                <input type="text" id="searchInput" placeholder="Ketik kata kunci: tugas, php, ujian..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm transition">
            </div>

            <div>
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-3">Daftar Link Tersedia:</span>
                <div id="linkList" class="space-y-2 max-h-64 overflow-y-auto pr-2 custom-scrollbar">
                </div>
            </div>
        </div>
        
    </div>

    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800">
        &copy; 2026 Jurusan Rekayasa Perangkat Lunak &bull; Powered by GitHub Pages
    </footer>

    <!-- Memanggil satu file JS lengkap -->
    <script src="script.js"></script>
</body>
</html>
